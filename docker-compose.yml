# docker compose up -d --build
#   API        http://localhost:8000/docs      Phoenix   http://localhost:6006
# Más workers:  docker compose up -d --scale worker=3
services:
  redis:
    image: redis:8            # Redis 8 ya trae RedisJSON y RediSearch (los exige el checkpointer de LangGraph).
    # Si usás una versión anterior a 8:  image: redis/redis-stack-server:latest
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]     # persistencia: los jobs sobreviven al reinicio de Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.23.0     # tag fijo (verificado: misma imagen que :latest al 2026-10-20)
    ports:
      - "6006:6006"           # UI + OTLP/HTTP (/v1/traces)
      - "4317:4317"           # OTLP/gRPC
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes: ["phoenix-data:/mnt/data"]

  api:
    build: .
    env_file: [.env]
    environment: &entorno
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      WORKER_EMBEDDED: "false"    # el trabajo lo hace el servicio `worker`
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment: *entorno
    depends_on:
      redis: { condition: service_healthy }
      phoenix: { condition: service_started }
    restart: unless-stopped

volumes:
  redis-data:
  phoenix-data:
